/* 상단 메뉴 */
.top-nav{
    width:100%;
    background:#0f172a;
    padding:15px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.top-nav a{
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:12px 20px;

    font-weight:bold;

}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card a{
    text-decoration:none;
    color:#2563eb;
    font-size:22px;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:30px;
